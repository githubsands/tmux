<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a78"/>
    </marker>
  </defs>

  <rect width="960" height="880" fill="#ffffff"/>

  <!-- server -->
  <rect x="20" y="20" width="920" height="600" rx="14" fill="#f7f9fc" stroke="#4a5a78" stroke-width="2"/>
  <text x="40" y="46" font-size="16" font-weight="bold" fill="#1c2740">tmux server 1</text>
  <text x="164" y="46" font-size="14" fill="#4a5a78">socket: agents ($TMUX_TMPDIR/tmux-UID/agents, or $TMUX_AGENTS)</text>

  <!-- session -->
  <rect x="40" y="62" width="880" height="488" rx="12" fill="#ffffff" stroke="#8592ad" stroke-width="1.5"/>
  <text x="60" y="88" font-size="15" font-weight="bold" fill="#1c2740">session: research</text>
  <text x="204" y="88" font-size="13" fill="#5b6780">tmux new-agent-session -s research -N 3</text>

  <!-- operator -->
  <rect x="70" y="110" width="240" height="80" rx="10" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="190" y="143" font-size="16" font-weight="bold" fill="#0b2a66" text-anchor="middle">0: operator</text>
  <text x="190" y="167" font-size="13" fill="#0b2a66" text-anchor="middle">your shell</text>

  <!-- control-agent -->
  <rect x="560" y="110" width="330" height="80" rx="10" fill="#f3e8ff" stroke="#8a3fd1" stroke-width="2"/>
  <text x="725" y="143" font-size="16" font-weight="bold" fill="#3b0a66" text-anchor="middle">1: control-agent</text>
  <text x="725" y="167" font-size="13" fill="#3b0a66" text-anchor="middle">head agent - claude / codex / openai</text>

  <!-- multiplexer -->
  <polygon points="320,300 352,262 608,262 640,300 608,338 352,338" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <text x="480" y="295" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">multiplexer</text>
  <text x="480" y="317" font-size="12" fill="#222222" text-anchor="middle">strip escapes, tag lines [index:name]</text>

  <!-- feed file -->
  <path d="M710,272 a85,12 0 0,0 170,0 v62 a85,12 0 0,1 -170,0 z" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <ellipse cx="795" cy="272" rx="85" ry="12" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <text x="795" y="308" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">$TMUX_AGENT_FEED</text>
  <text x="795" y="327" font-size="12" fill="#222222" text-anchor="middle">SOCKET-agents-ID.log</text>

  <!-- record file -->
  <path d="M85,272 a105,12 0 0,0 210,0 v62 a105,12 0 0,1 -210,0 z" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <ellipse cx="190" cy="272" rx="105" ry="12" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <text x="190" y="308" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">$TMUX_AGENT_RECORD</text>
  <text x="190" y="327" font-size="12" fill="#222222" text-anchor="middle">conversation id per agent</text>
  <path d="M190,348 L190,426" stroke="#4a5a78" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="82" y="392" font-size="12" fill="#4a5a78">claude --resume</text>
  <text x="82" y="408" font-size="12" fill="#4a5a78">on exit</text>

  <!-- agents -->
  <rect x="70" y="430" width="240" height="80" rx="10" fill="#e6f7ec" stroke="#2f9e5a" stroke-width="2"/>
  <text x="190" y="463" font-size="16" font-weight="bold" fill="#0d3d20" text-anchor="middle">2: agent-1</text>
  <text x="190" y="487" font-size="13" fill="#0d3d20" text-anchor="middle">running</text>

  <rect x="360" y="430" width="240" height="80" rx="10" fill="#fff6e0" stroke="#d19a1f" stroke-width="2"/>
  <text x="480" y="463" font-size="16" font-weight="bold" fill="#5a3d00" text-anchor="middle">3: agent-2</text>
  <text x="480" y="487" font-size="13" fill="#5a3d00" text-anchor="middle">idle</text>

  <rect x="650" y="430" width="240" height="80" rx="10" fill="#fde8e8" stroke="#c94040" stroke-width="2"/>
  <text x="770" y="463" font-size="16" font-weight="bold" fill="#5c1010" text-anchor="middle">4: agent-3</text>
  <text x="770" y="487" font-size="13" fill="#5c1010" text-anchor="middle">exited</text>

  <!-- arrows: agents to multiplexer -->
  <g stroke="#4a5a78" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190,430 L410,342"/>
    <path d="M480,430 L480,342"/>
    <path d="M770,430 L550,342"/>
    <!-- multiplexer to control-agent (input) -->
    <path d="M540,262 L640,194"/>
    <!-- multiplexer to feed file -->
    <path d="M640,300 L706,300"/>
  </g>
  <!-- feed file read by control-agent -->
  <path d="M795,260 L795,194" stroke="#4a5a78" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>

  <g font-size="12" fill="#4a5a78">
    <text x="490" y="395">output</text>
    <text x="508" y="222">agent-feed input</text>
    <text x="646" y="292">file</text>
    <text x="803" y="232">reads</text>
  </g>

  <!-- other sessions -->
  <rect x="40" y="564" width="880" height="40" rx="10" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="480" y="589" font-size="13" fill="#777777" text-anchor="middle">other agent sessions on the same server</text>

  <!-- tmux server 2 -->
  <rect x="20" y="640" width="450" height="184" rx="14" fill="#f7f9fc" stroke="#4a5a78" stroke-width="2"/>
  <text x="40" y="666" font-size="16" font-weight="bold" fill="#1c2740">tmux server 2</text>
  <text x="164" y="666" font-size="13" fill="#4a5a78">socket: work (tmux -L work)</text>
  <rect x="40" y="682" width="410" height="124" rx="12" fill="#ffffff" stroke="#8592ad" stroke-width="1.5"/>
  <text x="56" y="704" font-size="14" font-weight="bold" fill="#1c2740">session: infra</text>
  <rect x="54" y="722" width="120" height="66" rx="8" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="114" y="751" font-size="13" font-weight="bold" fill="#0b2a66" text-anchor="middle">0: operator</text>
  <text x="114" y="771" font-size="11" fill="#0b2a66" text-anchor="middle">shell</text>
  <rect x="184" y="722" width="120" height="66" rx="8" fill="#f3e8ff" stroke="#8a3fd1" stroke-width="2"/>
  <text x="244" y="751" font-size="13" font-weight="bold" fill="#3b0a66" text-anchor="middle">1: control-agent</text>
  <text x="244" y="771" font-size="11" fill="#3b0a66" text-anchor="middle">head agent</text>
  <rect x="314" y="722" width="120" height="66" rx="8" fill="#e6f7ec" stroke="#2f9e5a" stroke-width="2"/>
  <text x="374" y="751" font-size="13" font-weight="bold" fill="#0d3d20" text-anchor="middle">2: agent-1</text>
  <text x="374" y="771" font-size="11" fill="#0d3d20" text-anchor="middle">running</text>

  <!-- stock server -->
  <rect x="490" y="640" width="450" height="184" rx="14" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="666" font-size="16" font-weight="bold" fill="#777777">tmux server 3</text>
  <text x="634" y="666" font-size="13" fill="#888888">socket: default (stock tmux)</text>
  <rect x="510" y="682" width="410" height="124" rx="12" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="526" y="704" font-size="14" font-weight="bold" fill="#777777">session: main</text>
  <rect x="524" y="722" width="120" height="66" rx="8" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="584" y="760" font-size="13" fill="#777777" text-anchor="middle">0: zsh</text>
  <rect x="654" y="722" width="120" height="66" rx="8" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.5"/>
  <text x="714" y="760" font-size="13" fill="#777777" text-anchor="middle">1: vim</text>
  <text x="846" y="751" font-size="12" fill="#888888" text-anchor="middle">plain windows,</text>
  <text x="846" y="768" font-size="12" fill="#888888" text-anchor="middle">no agents</text>

  <!-- choose-server -->
  <text x="480" y="858" font-size="13" fill="#4a5a78" text-anchor="middle">each server is separate; tmux choose-server (prefix + S) lists them all and attaches to any of them</text>
</svg>

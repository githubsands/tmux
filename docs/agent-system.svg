  <rect x="366" y="1006" width="308" height="18" rx="9" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="520" y="1019" font-size="10.5" fill="#0b2a66" text-anchor="middle" font-family="Menlo, Monaco, monospace">operator key 0386&#8230;FC52 &#183; signs every agent key</text>
  <text x="810" y="1052" font-size="13" fill="#4a5a78" text-anchor="middle">every agent holds its own pgp private key (its own GNUPGHOME); the operator signs each public key and agents trust the operator</text>
  <text x="810" y="1074" font-size="13" fill="#4a5a78" text-anchor="middle">each server is separate; choose-server (prefix + S) lists them all and attaches to any of them</text>
